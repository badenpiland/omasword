name: Release

on:
  push:
    tags:
      - 'v*'

# Each job asks only for what it needs; third-party actions are pinned to a
# commit so a moved tag can't change what runs with write access.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    env:
      OUTPUT: omasword-linux-${{ matrix.goarch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version shown in the app comes from internal/version; refuse to
      # release a tag that doesn't match it.
      - name: Check tag matches app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -qF "const Version = \"$TAG\"" internal/version/version.go || {
            echo "::error::tag $TAG does not match Version in internal/version/version.go"
            exit 1
          }

      # Build with the newest stable Go, not the minimum in go.mod: Go
      # compiles its standard library (HTTPS, certificate checks) into the
      # binary, so an old toolchain ships its old security bugs.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          check-latest: true

      - name: Test
        run: go test ./...

      # Fail the release if the code reaches a known vulnerability, in a
      # dependency or in the Go standard library itself. The tool is built
      # for the runner; only the scan targets the matrix architecture
      # (`go run` with GOARCH=arm64 would build a tool the runner can't run).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Check for known vulnerabilities
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          BUILD_NUMBER: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags="-s -w -X omasword/internal/version.BuildNumber=${BUILD_NUMBER}" \
            -o "$OUTPUT" ./cmd/omasword
          tar -czf "$OUTPUT.tar.gz" "$OUTPUT" README.md LICENSE assets/omasword.png

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.OUTPUT }}
          path: ${{ env.OUTPUT }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
